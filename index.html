<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TALOS - Studio Lite</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: radial-gradient(circle at top, #1a1a1a, #000);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 30px 10px;
}

.profile {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.profile img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 3px solid #ff3b3b;
  box-shadow: 0 0 25px rgba(255,59,59,0.3);
}

.name {
  margin-top: 15px;
  font-size: 1.8rem;
  font-weight: 700;
  text-transform: uppercase;
}

.desc {
  margin-top: 5px;
  color: #ccc;
  font-size: 1rem;
  text-align: center;
}

.links {
  margin-top: 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 100%;
  max-width: 400px;
}

.link-btn {
  display: flex;
  align-items: center;
  gap: 15px;
  background: #ff3b3b;
  color: white;
  font-weight: bold;
  text-decoration: none;
  border-radius: 12px;
  padding: 14px 16px;
  transition: 0.3s;
  box-shadow: 0 4px 15px rgba(255,59,59,0.4);
}

.link-btn:hover {
  transform: scale(1.04);
}

.link-btn img {
  width: 45px;
  height: 45px;
  border-radius: 10px;
}

.link-text {
  display: flex;
  flex-direction: column;
}

.link-title {
  font-size: 1rem;
}

.link-desc {
  font-size: 0.75rem;
  font-weight: normal;
  color: #e0e0e0;
}

.discord {
  background: #5865F2;
  box-shadow: 0 4px 15px rgba(88,101,242,0.4);
}

footer {
  margin-top: 50px;
  font-size: 0.8rem;
  color: #777;
  text-align: center;
}

.credits {
  margin-top: 8px;
  font-size: 0.9rem;
  color: #aaa;
  text-align: center;
}
</style>
</head>

<body>

<div class="profile">
  <img src="https://raw.githubusercontent.com/thalles781/TalosSite/refs/heads/main/Assets/1762210487862.jpg" alt="Talos Profile">
  <div class="name">TALOS</div>
  <div class="desc">🇧🇷  Scripts e modelos de Studio Lite! Se inscreve! 🔥</div>
</div>

<div class="links">

  <a href="https://youtube.com/@talos1234" target="_blank" class="link-btn">
    <img src="https://raw.githubusercontent.com/thalles781/TalosSite/refs/heads/main/Assets/1762210487862.jpg">
    <div class="link-text">
      <div class="link-title">Canal do Talos</div>
    </div>
  </a>

  <a href="https://discord.gg/CSafaFxMF" target="_blank" class="link-btn discord">
    <img src="https://raw.githubusercontent.com/thalles781/TalosSite/refs/heads/main/Assets/3670157.png">
    <div class="link-text">
      <div class="link-title">Servidor do Discord</div>
      <div class="link-desc">Link é sempre atualizado após 14 dias.</div>
    </div>
  </a>

</div>

<footer>Criado por Talos 😎</footer>
<div class="credits">Créditos da GFX: misterycreator</div>

</body>
</html>
